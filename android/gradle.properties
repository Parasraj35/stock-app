org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler computes relative paths between the pub
# cache (C:\) and this project (D:\); on Windows that throws
# "this and base files have different roots" for cross-drive setups like
# image_picker_android's Kotlin sources. Incremental compilation isn't
# needed for our build sizes, so it's simplest to just turn it off.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
